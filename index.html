<script>
const STORAGE_KEY = 'ff-canteen-tick-2026-11-26-v1';
const LAST_PULL = 'Wed 25 Nov 2026, 3:47pm AEDT'; // update on every Bopple pull
// FF Checklist ticks live in this same object as "checklist:<item name>".
// Bump STORAGE_KEY each new pull so old ticks reset.
// Service for a line: explicit "lunch"/"recess" in that line's notes wins, then the
// product default (snacks → recess, everything else → lunch). Order notes are
// ignored for service. Future pulls should store lineNotes/orderNotes and call
// assignService — do not hard-code service from the product list alone.
// Display is separate from service. A note is a staff instruction when it says
// something besides who the food is for and which service it is. Name-only and
// recess/lunch notes stay off the cards. The full original wording is shown.
function explicitService(text){
  if (!text) return null;
  const s = String(text).toLowerCase();
  const lunch = /\blunch\b/.test(s);
  const recess = /\brecess\b/.test(s);
  if (lunch === recess) return null;
  return lunch ? 'lunch' : 'recess';
}
function productDefaultService(name){
  const n = String(name || '').toLowerCase();
  if (n.includes('banana') && n.includes('bread')) return 'recess'; // incl. Banana Blueberry Bread
  if (n.includes('acai')) return 'recess';
  if (n.includes('nudi')) return 'recess'; // also Nudie Juice
  if (n.includes('juicies')) return 'recess';
  if (n.includes('buckwheat')) return 'recess';
  if (n.includes('parfait')) return 'recess';
  if (n.includes('tempeh')) return 'recess';
  if (n.includes('cookie') && n.includes('oat')) return 'recess';
  if (n.includes('loco love')) return 'recess';
  return 'lunch';
}
function assignService(name, lineNotes, orderNotes){
  return explicitService(lineNotes) || productDefaultService(name); // order-level notes never override
}
// Words that identify who or which service, not how to make or hand out the food.
const IDENTITY_WORDS = new Set(['recess','lunch','for','and','the','a','an','of','to','my','our','order','orders','canteen','toronto','tas','kindy','kinder','kindergarten','class','grade','year','prep','school','adventist','primary']);
function nameTokens(){
  const bag = new Set();
  for (const part of arguments) {
    String(part || '').toLowerCase().split(/[^a-z0-9']+/).forEach(w => { if (w) bag.add(w); });
  }
  return bag;
}
function isIdentityOnly(text, bag){
  const words = String(text || '').toLowerCase().split(/[^a-z0-9']+/).filter(Boolean);
  if (!words.length) return true;
  for (const w of words) {
    if (w.length === 1 || /^\d+$/.test(w)) continue;
    if (bag.has(w) || IDENTITY_WORDS.has(w)) continue;
    return false;
  }
  return true;
}
function lineRequest(item, person){
  const curated = String(item.special || '').trim();
  if (curated) return curated;
  const note = String(item.lineNotes || '').trim();
  if (!note) return '';
  const bag = nameTokens(person && person.name, person && person.parent, item.child);
  return isIdentityOnly(note, bag) ? '' : note;
}
function orderRequest(person){
  const note = String(person && person.orderNotes || '').trim();
  if (!note) return '';
  const source = (typeof PEOPLE !== 'undefined' && PEOPLE.find(p => p.id === person.id)) || person;
  const kids = (source.items || []).map(i => i.child);
  const bag = nameTokens(source.name, source.parent, person.name, person.parent, ...kids);
  return isIdentityOnly(note, bag) ? '' : note;
}
function addAggRequest(row, kind, text, who, qty){
  if (!text) return;
  const found = row.requests.find(r => r.kind === kind && r.text === text && r.who === who);
  if (found) found.qty += qty;
  else row.requests.push({ kind, text, who, qty });
}
function formatRequestFlag(r){
  if (r.kind === 'order') return `Order note: ${r.text} (${r.who})`;
  const prefix = r.qty === 1 ? '1 special request' : `${r.qty} special requests`;
  return `${prefix}: ${r.text} (${r.who})`;
}
function requestFlagsHtml(requests){
  return (requests || []).map(r => `<span class="prep-flag">${escapeHtml(formatRequestFlag(r))}</span>`).join('');
}
function collectPersonRequests(person){
  const lines = [];
  const order = orderRequest(person);
  if (order) lines.push({ kind:'order', item:'', text:order, qty:1 });
  const map = new Map();
  for (const i of person.items || []) {
    const text = lineRequest(i, person);
    if (!text) continue;
    const key = i.name + '\0' + text;
    const prev = map.get(key) || { kind:'item', item:i.name, text, qty:0 };
    prev.qty += i.qty || 1;
    map.set(key, prev);
  }
  for (const v of map.values()) lines.push(v);
  return lines;
}
function peopleWithRequests(){
  return PEOPLE
    .map(p => ({ p, lines: collectPersonRequests(p) }))
    .filter(x => x.lines.length)
    .sort((a, b) => a.p.name.localeCompare(b.p.name));
}
function expandItem(item, orderNotes){
  const qty = Math.max(1, item.qty || 1);
  const service = assignService(item.name, item.lineNotes, orderNotes);
  const units = [];
  for (let u = 1; u <= qty; u++) {
    units.push({
      ...item,
      service,
      qty: 1,
      unit: u,
      unitTotal: qty,
      id: qty > 1 ? item.id + '-u' + u : item.id,
    });
  }
  return units;
}
function expandPeople(people){
  for (const p of people) {
    const orderNotes = p.orderNotes || null;
    p.items = p.items.flatMap(item => expandItem(item, orderNotes));
  }
}
const PEOPLE = [
  { id:'26931081', orderId:'26931081', dockets:['dockets/26931081.svg'], name:"Diane Lapuz Hope", parent:"Diane Lapuz Hope (staff complimentary)", pickup:"Thu 26 9:00am", items:[
    { id:"26931081-juicies-tube-lemonade-0", qty:1, name:"Juicies Tube (Lemonade)" },
    { id:"26931081-pasta-napolitana-sauce-whole-wheat-1", qty:1, name:"Pasta & Napolitana Sauce (Whole Wheat)" },
  ]},
  { id:'26932659', orderId:'26932659', dockets:['dockets/26932659.svg'], name:"Maja Rees", parent:"Joel Rees", pickup:"Thu 26 9:00am", items:[
    { id:"26932659-juicies-100ml-watermelon-0", qty:1, name:"Juicies 100ml - Watermelon", child:"Maja" },
    { id:"26932659-pies-peppersteak-1", qty:1, name:"Pies (Peppersteak)", child:"Maja" },
  ]},
  { id:'26933626', orderId:'26933626', dockets:['dockets/26933626.svg'], name:"Haon & Paul", parent:"JaeDeok Yu", pickup:"Thu 26 10:00am", items:[
    { id:"26933626-nacho-bowl-0", qty:1, name:"Nacho Bowl" },
  ]},
  { id:'26934296', orderId:'26934296', dockets:['dockets/26934296.svg'], name:"Chloe & Matthias", parent:"Karina Mora", pickup:"Thu 26 10:00am", items:[
    { id:"26934296-gf-banana-blueberry-bread-0", qty:1, name:"GF Banana Blueberry Bread" },
    { id:"26934296-gf-banana-bread-1", qty:1, name:"GF Banana Bread" },

function loadObs(){
  try {
    const cur = localStorage.getItem(OBS_KEY);
    if (cur) return JSON.parse(cur);
    const prev = localStorage.getItem(OBS_KEY_PREV);
    if (prev) { localStorage.setItem(OBS_KEY, prev); return JSON.parse(prev); }

}

function isPrepView(){ return view.startsWith('prep-'); }
function isChecklistView(){ return view === 'ff-checklist'; }

function prepKey(svc, name){ return 'prep:' + svc + ':' + name; }
function checklistKey(name){ return 'checklist:' + name; }
const CHECKLIST_LETTUCE = 'Head of Lettuce';
function effectiveService(item){
  const moved = serviceMoves[item.id];
  return (moved === 'lunch' || moved === 'recess') ? moved : item.service;
}
function findItem(id){
  for (const p of PEOPLE) for (const i of p.items) if (i.id === id) return i;
  return null;
}
function itemsForService(svc){
  const out=[];
  for (const p of PEOPLE){
    const items=p.items.filter(i=>effectiveService(i)===svc);
    if(items.length) out.push({...p, items});
  }
  out.sort((a,b)=>a.name.localeCompare(b.name));
  return out;
}
function aggregatePrep(svc){
  const map = new Map();
  for (const p of PEOPLE){
    const orderText = orderRequest(p);
    for (const i of p.items){
      if (effectiveService(i) !== svc) continue;
      let row = map.get(i.name);
      if (!row) { row = { id: prepKey(svc, i.name), name: i.name, qty: 0, requests: [] }; map.set(i.name, row); }
      row.qty += i.qty;
      addAggRequest(row, 'item', lineRequest(i, p), p.name, i.qty);
      addAggRequest(row, 'order', orderText, p.name, i.qty);
    }
  }
  return [...map.values()].sort((a,b) => a.name.localeCompare(b.name));
}
// Global stock list: every expanded unit once, across both services.
// A service move only changes effectiveService; it does not copy the line,
// so summing here cannot double-count. Always add 1 Head of Lettuce
// (nacho-bowl ingredient), even when lettuce is never ordered on its own.
function aggregateChecklist(){
  const map = new Map();
  for (const p of PEOPLE){
    const orderText = orderRequest(p);
    for (const i of p.items){
      let row = map.get(i.name);
      if (!row) { row = { id: checklistKey(i.name), name: i.name, qty: 0, requests: [] }; map.set(i.name, row); }
      row.qty += i.qty;
      addAggRequest(row, 'item', lineRequest(i, p), p.name, i.qty);
      addAggRequest(row, 'order', orderText, p.name, i.qty);
    }
  }
  let lettuce = map.get(CHECKLIST_LETTUCE);
  if (!lettuce) {
    lettuce = { id: checklistKey(CHECKLIST_LETTUCE), name: CHECKLIST_LETTUCE, qty: 0, requests: [] };
    map.set(CHECKLIST_LETTUCE, lettuce);
  }
  lettuce.qty += 1;
  return [...map.values()].sort((a,b) => a.name.localeCompare(b.name));
}

function render(){

    let svcTotal = 0, svcChecked = 0;

    document.getElementById('progText').textContent = `${svcChecked} / ${svcTotal} ${verb}`;
    document.getElementById('leftText').textContent = svcTotal ? `${svcTotal - svcChecked} left` : '';

    // Checklist chrome hides the filter chips, so always show the full global list.
    if (!checklist) {
      if (statusFilter === 'incomplete') rows = rows.filter(r => !done[r.id]);
      else if (statusFilter === 'complete') rows = rows.filter(r => !!done[r.id]);
    }

    if (!rows.length) {
      const empty = checklist
        ? 'Nothing on the checklist'
        : (statusFilter==='complete'?'Nothing marked prepped yet':statusFilter==='incomplete'?'All prep items done':'Nothing to prep');
      list.innerHTML = `<div class="no-match">${empty}</div>`;

  const service = serviceOfView();

  for (const g of serviceAll) for (const i of g.items) { svcTotal += i.qty; if (done[i.id]) svcChecked += i.qty; }
  if (q) {
    groups = groups.map(g => {

      return { ...g, items };
    }).filter(g => g.items.length);
  }
  if (statusFilter === 'incomplete') {
    groups = groups.map(g => ({
      ...g,
      items: g.items.filter(i => !done[i.id])

  } else if (statusFilter === 'complete') {
    groups = groups.map(g => ({
      ...g,
      items: g.items.filter(i => !!done[i.id])

  }
  document.getElementById('progText').textContent=`${svcChecked} / ${svcTotal} handed out`;
  document.getElementById('leftText').textContent=svcTotal?`${svcTotal-svcChecked} left`:'';
  document.getElementById('progBar').style.width=svcTotal?`${(svcChecked/svcTotal)*100}%`:'0%';
  if (!groups.length) {

  list.innerHTML=groups.map(g=>{
    const allDone=g.items.every(i=>done[i.id]);

    const badge=g.missing?'<span class="badge">WAS MISSING</span>':'';
    const rows=g.items.map(i=>{
      const isDone=!!done[i.id];

      const movedHint = (serviceMoves[i.id] && serviceMoves[i.id] !== i.service)

      const request = lineRequest(i, g);
      const special = request

      return `<div class="item ${isDone?'done':''}${request?' has-request':''}">
        <label class="item-main">
          <input type="checkbox" data-id="${escapeHtml(i.id)}" ${isDone?'checked':''}/>
          <span class="label-col">
            <span class="label">${unitTag}${childTag}${escapeHtml(i.name)}${movedHint}</span>

        const obsVal = observations[g.id] || '';

function formatReportDate(d) {

function requestReportHtml() {
  const rows = peopleWithRequests();
  if (!rows.length) return '';
  return `<h2>Customer special requests</h2>` + rows.map(({ p, lines }) => {
    const meta = [p.parent ? 'Parent: ' + p.parent : null, p.pickup ? 'Pickup ' + p.pickup : null].filter(Boolean).join(' · ');
    const body = lines.map(r => {
      if (r.kind === 'order') return `<div class="note"><span class="special-kicker">Order note</span>${escapeHtml(r.text)}</div>`;
      const qty = r.qty > 1 ? ` ×${r.qty}` : '';
      return `<div class="note"><span class="special-kicker">${escapeHtml(r.item + qty)}</span>${escapeHtml(r.text)}</div>`;
    }).join('');
    return `<article class="obs-entry request-entry">
      <div class="who">${escapeHtml(p.name)}${p.missing ? ' <span class="badge">WAS MISSING</span>' : ''}</div>
      ${meta ? `<div class="who-meta">${escapeHtml(meta)}</div>` : ''}
      ${body}
    </article>`;
  }).join('');
}
function buildReportText() {
  const lines = [];
  const now = new Date();
  const reqRows = peopleWithRequests();
  if (reqRows.length) {
    lines.push('Customer special requests — ' + formatReportDate(now));
    lines.push('');
    for (const { p, lines: reqs } of reqRows) {
      const meta = [p.parent ? 'Parent: ' + p.parent : null, p.pickup ? 'Pickup ' + p.pickup : null].filter(Boolean).join(' · ');
      lines.push(p.name);
      if (meta) lines.push(meta);
      for (const r of reqs) {
        if (r.kind === 'order') lines.push('Order note: ' + r.text);
        else lines.push(r.item + (r.qty > 1 ? ' x' + r.qty : '') + ': ' + r.text);
      }
      lines.push('');
    }
  }
  lines.push('Observations — ' + formatReportDate(now));
  lines.push('Generated: ' + now.toLocaleString('en-AU'));
  lines.push('');
  const rows = entriesWithObs();
  if (!rows.length) {
    lines.push('(No observations entered yet.)');
  } else {
    for (const { p, note } of rows) {
      const meta = [p.parent ? 'Parent: ' + p.parent : null, p.pickup ? 'Pickup ' + p.pickup : null].filter(Boolean).join(' · ');
      lines.push(p.name);
      if (meta) lines.push(meta);
      lines.push(note);
      lines.push('');
    }
  }
  return lines.join('\n').trim() + '\n';
}

    });
  });
  box.classList.add('open');
  box.setAttribute('aria-hidden', 'false');
}
function closeDocketLightbox() {
  const box = document.getElementById('docketLightbox');
  box.classList.remove('open');
  box.setAttribute('aria-hidden', 'true');
  document.getElementById('lbImgs').innerHTML = '';
}
document.getElementById('list').addEventListener('click', (e) => {
  const moveBtn = e.target.closest('.btn-move');
  if (moveBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = moveBtn.dataset.moveId;
    const to = moveBtn.dataset.moveTo;
    const item = findItem(id);
    if (!item || (to !== 'lunch' && to !== 'recess')) return;
    if (to === item.service) delete serviceMoves[id];
    else serviceMoves[id] = to;
    saveMoves();
    render();
    return;
  }
  const btn = e.target.closest('.btn-docket');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  let paths = [];
  try { paths = JSON.parse(btn.dataset.dockets || '[]'); } catch {}
  openDocketLightbox(paths, btn.dataset.docketName || '');
});
document.addEventListener('click', (e) => {
  if (e.target.closest('#lbClose')) {
    e.preventDefault();
    e.stopPropagation();
    closeDocketLightbox();
    return;
  }
  if (e.target.id === 'docketLightbox') closeDocketLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDocketLightbox();
});

render();
</script>

</body>
</html>
