<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Canteen Tick"/>
<title>FF Canteen Tick · Ready</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --accent: #0f766e; --line: #e7e5e4; --warn: #9a3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    margin: -12px -12px 12px; padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; }
  .tabs { display: flex; gap: 8px; }
  .tab {
    flex: 1; border: none; border-radius: 999px; padding: 12px 10px;
    font-size: 0.95rem; font-weight: 600; background: #e7e5e4; color: var(--ink);
  }
  .tab.active { background: var(--accent); color: #fff; }
  .progress {
    margin-top: 10px; font-size: 0.9rem; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .bar { height: 8px; background: #e7e5e4; border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 0.8rem; font-weight: 600;
  }
  .child {
    background: var(--card); border-radius: 14px; padding: 12px 12px 8px;
    margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .child.complete { opacity: 0.55; }
  .child.missing { outline: 2px solid #f59e0b; }
  .badge {
    display: inline-block; font-size: 0.65rem; font-weight: 700;
    background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 6px; margin-left: 6px;
  }
  .child-name { font-weight: 700; font-size: 1.05rem; }
  .child-meta { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 4px; border-top: 1px solid var(--line);
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .item input { width: 26px; height: 26px; margin-top: 1px; flex-shrink: 0; accent-color: var(--accent); }
  .item.done .label { text-decoration: line-through; color: var(--muted); }
  .label { font-size: 0.98rem; line-height: 1.35; flex: 1; }
  .qty { display: inline-block; min-width: 1.6em; font-weight: 700; color: var(--accent); margin-right: 4px; }
  .special { display: block; margin-top: 4px; font-size: 0.78rem; color: var(--warn); font-weight: 600; }
  
  .search-wrap { margin-top: 10px; }
  .search-wrap input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); font-size: 1rem;
    background: var(--card); color: var(--ink);
  }
  .search-wrap input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .no-match { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 0.95rem; }

  
  .obs-wrap { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .obs-wrap label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .obs-wrap textarea {
    width: 100%; min-height: 56px; resize: vertical; padding: 10px;
    border-radius: 10px; border: 1px solid var(--line); font-size: 0.92rem;
    font-family: inherit; background: #fafaf9; color: var(--ink);
  }
  .obs-wrap textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); background: #fff; }
  .obs-wrap textarea.has-text { background: #fff7ed; border-color: #fdba74; }
  body.view-report header.tick-chrome,
  body.view-report #list,
  body.view-report footer.tick-footer { display: none; }
  body.view-report #reportPage { display: block; }
  #reportPage { display: none; padding: 16px 14px 40px; max-width: 720px; margin: 0 auto; }
  #reportPage .report-top {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 8px 0 12px; margin: -8px 0 8px;
  }
  #reportPage h1 {
    margin: 10px 0 4px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em;
  }
  #reportPage .report-date { color: var(--muted); font-size: 0.95rem; margin-bottom: 14px; }
  #reportPage .report-empty {
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
    padding: 28px 16px; text-align: center; color: var(--muted);
  }
  .obs-entry {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;

  }
  .obs-entry .who { font-weight: 800; font-size: 1.05rem; }
  .obs-entry .who-meta { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .obs-entry .note {
    margin-top: 10px; white-space: pre-wrap; line-height: 1.45;
    background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; padding: 10px 12px;
  }
  .report-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .report-actions button {
    flex: 1; min-width: 120px; padding: 12px; border-radius: 10px; border: none;
    font-weight: 700; font-size: 0.9rem;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #e7e5e4; color: var(--ink); }
  #btnBackTick {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 0.9rem;
  }

  
  .filters { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .filter-chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 12px; font-size: 0.82rem; font-weight: 700;
  }
  .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  

  .child-tag {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 7px;
    border-radius: 999px;
    background: #e8f5f1;
    color: #0d5c4d;
    font-size: 0.72rem;
    font-weight: 800;
    vertical-align: middle;
  }

  #btnReport {
    width: 100%;
    margin-top: 10px;
    padding: 14px 12px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
  }


  .prep-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  }
  .prep-row.done { opacity: 0.55; }
  .prep-row.done .prep-name { text-decoration: line-through; }
  .prep-qty {
    min-width: 48px; height: 48px; border-radius: 12px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;

  .prep-row.done .prep-qty { background: #a8a29e; }
  .prep-name { font-weight: 700; font-size: 1rem; flex: 1; }
  .prep-row input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); flex-shrink: 0; }
  .tabs { flex-wrap: wrap; }
  .tab { font-size: 0.82rem; }
  .chrome-handout .search-wrap,
  .chrome-handout .filters,
  .chrome-handout #btnReport,
  body.mode-prep .search-wrap,
  body.mode-prep #btnReport { display: none; }




  .child-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .child-head-text { flex: 1; min-width: 140px; }
  .btn-docket {
    border: 1px solid var(--accent); background: #ecfdf5; color: var(--accent);
    border-radius: 999px; padding: 8px 12px; font-size: 0.75rem; font-weight: 800;
    white-space: nowrap; cursor: pointer; min-height: 36px;
    touch-action: manipulation;
  }
  .btn-docket:active { background: #d1fae5; }
  .docket-actions {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    justify-content: flex-end;
  }
  .btn-add-photo {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent);
    border-radius: 999px; padding: 8px 12px; font-size: 0.75rem; font-weight: 800;
    white-space: nowrap; cursor: pointer; min-height: 36px;
    touch-action: manipulation;
  }
  .btn-add-photo:active { background: #d1fae5; }
  .btn-add-photo input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer; font-size: 16px;
  }
  .docket-badge {
    display: inline-flex; align-items: center;
    font-size: 0.65rem; font-weight: 800;
    background: #ecfdf5; color: var(--accent);
    border: 1px solid #99f6e4;
    padding: 4px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  @media (max-width: 420px) {
    .docket-actions { width: 100%; justify-content: flex-start; }
    .btn-add-photo, .btn-docket { min-height: 44px; padding: 10px 14px; }
  }
  #docketLightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.72); padding: 16px; overflow: auto;
    align-items: flex-start; justify-content: center;
  }
  #docketLightbox.open { display: flex; }
  #docketLightbox .lb-inner {
    position: relative; background: #fff; border-radius: 14px;
    padding: 14px; max-width: 720px; width: 100%; margin: auto;
  }
  #docketLightbox .lb-close {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
    border: none; border-radius: 999px; background: #e7e5e4; color: #1c1917;
    font-size: 1.4rem; font-weight: 800; cursor: pointer; line-height: 1;
    z-index: 5; -webkit-tap-highlight-color: transparent;
  }
  #docketLightbox .lb-title { font-weight: 800; margin: 0 40px 10px 0; font-size: 1rem; }
  #docketLightbox .lb-imgs { display: flex; flex-direction: column; gap: 12px; }
  #docketLightbox img {
    width: 100%; height: auto; border-radius: 10px; display: block;
    background: #f5f5f4;
  }
  #docketLightbox .lb-note { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
  #docketLightbox .lb-shot { display: flex; flex-direction: column; gap: 8px; }
  #docketLightbox .lb-cap {
    font-size: 0.72rem; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  #docketLightbox .lb-remove,
  #docketLightbox .lb-clear {
    min-height: 44px; border-radius: 10px; font-weight: 800;
    font-size: 0.9rem; cursor: pointer; touch-action: manipulation;
  }
  #docketLightbox .lb-remove {
    border: 1px solid #fdba74; background: #fff7ed; color: var(--warn);
  }
  #docketLightbox .lb-clear {
    width: 100%; border: none; background: var(--warn); color: #fff;
  }
  #docketLightbox .lb-actions { margin-top: 12px; }

  footer { text-align: center; color: var(--muted); font-size: 0.7rem; margin-top: 16px; }
</style>

<body>
<header class="tick-chrome">
  <h1>Food Farmacy · Canteen Tick</h1>
  <div class="sub">Previous canteen day cleared · ready for next orders · tap to tick off · docket photos stay on this phone</div>
  <div class="tabs">
    <button class="tab active" data-view="prep-recess" type="button">Recess Prep</button>
    <button class="tab" data-view="prep-lunch" type="button">Lunch Prep</button>
    <button class="tab" data-view="handout-recess" type="button">11am recess</button>
    <button class="tab" data-view="handout-lunch" type="button">1pm lunch</button>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search child, parent, or item…" autocomplete="off" enterkeyhint="search"/>
  </div>
  <div class="filters" role="group" aria-label="Completion filter">
    <button type="button" class="filter-chip active" data-filter="all">All</button>
    <button type="button" class="filter-chip" data-filter="incomplete">Incomplete</button>
    <button type="button" class="filter-chip" data-filter="complete">Complete</button>
  </div>
  <div class="progress">
    <span id="progText">0 / 0</span>
    <span id="leftText"></span>
  </div>
  <div class="bar"><span id="progBar"></span></div>
  <button type="button" id="btnReport">Generate observation report</button>
</header>
<main id="list"></main>
<footer class="tick-footer">Food Farmacy canteen · ticks and docket photos stay on this phone · blank until next canteen day is loaded</footer>

<section id="reportPage" aria-label="Observations report">
  <div class="report-top">
    <button type="button" id="btnBackTick">← Back to tick list</button>
  </div>
  <h1>Observations</h1>
  <div class="report-date" id="reportDate"></div>
  <div id="reportEntries"></div>
  <div class="report-actions">
    <button type="button" class="btn-primary" id="btnCopyReport">Copy report</button>
    <button type="button" class="btn-secondary" id="btnDownloadReport">Download .txt</button>
  </div>
</section>



<div id="docketLightbox" aria-hidden="true">
  <div class="lb-inner" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
    <div class="lb-title" id="lbTitle">Docket</div>
    <div class="lb-imgs" id="lbImgs"></div>
    <div class="lb-actions" id="lbActions"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'ff-canteen-tick-wiped-2026-09-18-v1';
const PEOPLE = [
];
let view = 'prep-recess';
let searchQuery = '';
let statusFilter = 'all';
let done = loadDone();
let observations = loadObs();
function loadDone(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch { return {}; } }
function saveDone(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); }
const OBS_KEY = STORAGE_KEY + '-observations';
function loadObs(){ try { return JSON.parse(localStorage.getItem(OBS_KEY)||'{}'); } catch { return {}; } }
function saveObs(){ localStorage.setItem(OBS_KEY, JSON.stringify(observations)); }

// Photos are blobs in IndexedDB, never localStorage. The database name follows
// STORAGE_KEY so the next canteen-day wipe starts empty without clearing ticks.
const DOCKET_DB_NAME = 'ff-canteen-dockets-' + STORAGE_KEY;
const DOCKET_STORE = 'photos';
let docketDbPromise = null;
let docketCounts = Object.create(null);
let docketCountGen = 0;
let lbObjectUrls = [];
let lbPersonId = null;

function openDocketDb() {
  if (docketDbPromise) return docketDbPromise;
  docketDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      docketDbPromise = null;
      reject(new Error('IndexedDB unavailable'));
      return;
    }
    const req = indexedDB.open(DOCKET_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DOCKET_STORE)) {
        const store = db.createObjectStore(DOCKET_STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('byPerson', 'personId', { unique: false });
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); docketDbPromise = null; };
      db.onclose = () => { docketDbPromise = null; };
      resolve(db);
    };
    req.onerror = () => { docketDbPromise = null; reject(req.error); };
    req.onblocked = () => { docketDbPromise = null; reject(new Error('IndexedDB blocked')); };
  });
  return docketDbPromise;
}
function isImageFile(file) {
  if (!file || !file.size) return false;
  if (file.type && file.type.startsWith('image/')) return true;
  return /\.(jpe?g|png|gif|webp|heic|heif|bmp|avif)$/i.test(file.name || '');
}
async function refreshDocketCounts() {
  const gen = ++docketCountGen;
  const db = await openDocketDb();
  const keys = await new Promise((resolve, reject) => {
    const tx = db.transaction(DOCKET_STORE, 'readonly');
    const req = tx.objectStore(DOCKET_STORE).index('byPerson').getAllKeys();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
  if (gen !== docketCountGen) return;
  const next = Object.create(null);
  for (const personId of keys) next[personId] = (next[personId] || 0) + 1;
  docketCounts = next;
}
async function photosForPerson(personId) {
  const db = await openDocketDb();
  const key = String(personId);
  const rows = await new Promise((resolve, reject) => {
    const tx = db.transaction(DOCKET_STORE, 'readonly');
    const req = tx.objectStore(DOCKET_STORE).index('byPerson').getAll(key);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
  return rows
    .filter(r => r && r.blob && (!r.appKey || r.appKey === STORAGE_KEY))
    .sort((a, b) => (a.created - b.created) || (a.id - b.id));
}
async function addDocketPhotos(personId, files) {
  const images = [...files].filter(isImageFile);
  if (!images.length) return 0;
  const db = await openDocketDb();
  const key = String(personId);
  const t0 = Date.now();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DOCKET_STORE, 'readwrite');
    const store = tx.objectStore(DOCKET_STORE);
    images.forEach((file, i) => {
      store.add({
        personId: key,
        blob: file.slice(0, file.size, file.type || ''),
        created: t0 + i,
        appKey: STORAGE_KEY,
        name: file.name || ''
      });
    });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
  await refreshDocketCounts();
  return images.length;
}
async function deleteDocketPhoto(photoId) {
  const db = await openDocketDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DOCKET_STORE, 'readwrite');
    tx.objectStore(DOCKET_STORE).delete(photoId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
  await refreshDocketCounts();
}
async function clearDocketPhotos(personId) {
  const db = await openDocketDb();
  const key = String(personId);
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DOCKET_STORE, 'readwrite');
    const req = tx.objectStore(DOCKET_STORE).index('byPerson').openCursor(IDBKeyRange.only(key));
    req.onsuccess = () => {
      const cursor = req.result;
      if (cursor) { cursor.delete(); cursor.continue(); }
    };
    req.onerror = () => reject(req.error);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
  await refreshDocketCounts();
}
function staticDocketsFor(personId) {
  const person = PEOPLE.find(p => String(p.id) === String(personId));
  return (person && person.dockets && person.dockets.length) ? person.dockets : [];
}
function revokeLbUrls() {
  for (const url of lbObjectUrls) {
    try { URL.revokeObjectURL(url); } catch {}
  }
  lbObjectUrls = [];
}

function isPrepView(){ return view.startsWith('prep-'); }
function serviceOfView(){ return view.endsWith('recess') ? 'recess' : 'lunch'; }
function prepKey(svc, name){ return 'prep:' + svc + ':' + name; }
function itemsForService(svc){
  const out=[];
  for (const p of PEOPLE){
    const items=p.items.filter(i=>i.service===svc);
    if(items.length) out.push({...p, items});
  }
  out.sort((a,b)=>a.name.localeCompare(b.name));
  return out;
}
function aggregatePrep(svc){
  const map = new Map();
  for (const p of PEOPLE){
    for (const i of p.items){
      if (i.service !== svc) continue;
      const prev = map.get(i.name) || 0;
      map.set(i.name, prev + i.qty);
    }
  }
  return [...map.entries()]
    .map(([name, qty]) => ({ id: prepKey(svc, name), name, qty }))
    .sort((a,b) => a.name.localeCompare(b.name));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  const list=document.getElementById('list');
  document.body.classList.toggle('mode-prep', isPrepView());
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));

  if (isPrepView()) {
    const svc = serviceOfView();
    let rows = aggregatePrep(svc);
    let svcTotal = 0, svcChecked = 0;
    for (const r of rows) { svcTotal += r.qty; if (done[r.id]) svcChecked += r.qty; }
    document.getElementById('progText').textContent = `${svcChecked} / ${svcTotal} prepped`;
    document.getElementById('leftText').textContent = svcTotal ? `${svcTotal - svcChecked} left` : '';
    document.getElementById('progBar').style.width = svcTotal ? `${(svcChecked/svcTotal)*100}%` : '0%';

    if (statusFilter === 'incomplete') rows = rows.filter(r => !done[r.id]);
    else if (statusFilter === 'complete') rows = rows.filter(r => !!done[r.id]);

    if (!rows.length) {
      list.innerHTML = `<div class="no-match">${statusFilter==='complete'?'Nothing marked prepped yet':statusFilter==='incomplete'?'All prep items done':'Nothing to prep'}</div>`;
      return;
    }
    list.innerHTML = rows.map(r => {
      const isDone = !!done[r.id];
      return `<label class="prep-row ${isDone?'done':''}">
        <span class="prep-qty">${r.qty}</span>
        <span class="prep-name">${escapeHtml(r.name)}</span>
        <input type="checkbox" data-id="${escapeHtml(r.id)}" ${isDone?'checked':''}/>
      </label>`;
    }).join('');
    return;
  }

  const service = serviceOfView();
  let groups=itemsForService(service);
  const q = searchQuery.trim().toLowerCase();
  const serviceAll = groups;
  let svcTotal = 0, svcChecked = 0;
  for (const g of serviceAll) for (const i of g.items) { svcTotal += i.qty; if (done[i.id]) svcChecked += i.qty; }
  if (q) {
    groups = groups.map(g => {
      const parentHit = (g.parent||'').toLowerCase().includes(q);
      const nameHit = (g.name||'').toLowerCase().includes(q);
      const items = g.items.filter(i =>
        parentHit || nameHit ||
        (i.name||'').toLowerCase().includes(q) ||
        (i.special||'').toLowerCase().includes(q) ||
        (i.child||'').toLowerCase().includes(q)
      );
      if (parentHit || nameHit) return { ...g, items: g.items };
      return { ...g, items };
    }).filter(g => g.items.length);
  }
  if (statusFilter === 'incomplete') {
    groups = groups.map(g => ({
      ...g,
      items: g.items.filter(i => !done[i.id])
    })).filter(g => g.items.length);
  } else if (statusFilter === 'complete') {
    groups = groups.map(g => ({
      ...g,
      items: g.items.filter(i => !!done[i.id])
    })).filter(g => g.items.length);
  }
  document.getElementById('progText').textContent=`${svcChecked} / ${svcTotal} handed out`;
  document.getElementById('leftText').textContent=svcTotal?`${svcTotal-svcChecked} left`:'';
  document.getElementById('progBar').style.width=svcTotal?`${(svcChecked/svcTotal)*100}%`:'0%';
  if (!groups.length) {
    let emptyMsg = 'Nothing in this service';
    if (q && statusFilter !== 'all') emptyMsg = `No ${statusFilter} matches for “${escapeHtml(searchQuery.trim())}”`;
    else if (q) emptyMsg = `No matches for “${escapeHtml(searchQuery.trim())}”`;
    else if (statusFilter === 'incomplete') emptyMsg = 'All items in this service are complete';
    else if (statusFilter === 'complete') emptyMsg = 'No completed items in this service yet';
    list.innerHTML = `<div class="no-match">${emptyMsg}</div>`;
    return;
  }
  list.innerHTML=groups.map(g=>{
    const allDone=g.items.every(i=>done[i.id]);
    const meta=[g.parent?`Parent: ${g.parent}`:null, g.pickup?`Pickup ${g.pickup}`:null].filter(Boolean).join(' · ');
    const badge=g.missing?'<span class="badge">WAS MISSING</span>':'';
    const rows=g.items.map(i=>{
      const isDone=!!done[i.id];
      const childTag = i.child ? `<span class="child-tag">${escapeHtml(i.child)}</span>` : '';
      return `<label class="item ${isDone?'done':''}"><input type="checkbox" data-id="${i.id}" ${isDone?'checked':''}/><span class="label"><span class="qty">${i.qty}×</span>${childTag}${escapeHtml(i.name)}${i.special?`<span class="special">${escapeHtml(i.special)}</span>`:''}</span></label>`;
    }).join('');
        const obsVal = observations[g.id] || '';
    const obsClass = obsVal.trim() ? 'has-text' : '';
    const staticDockets = (g.dockets && g.dockets.length) ? g.dockets : [];
    const photoCount = docketCounts[String(g.id)] || 0;
    const showView = photoCount > 0 || staticDockets.length > 0;
    const docketBadge = photoCount ? `<span class="docket-badge">Docket · ${photoCount}</span>` : '';
    const viewLabel = photoCount
      ? `View docket, ${photoCount} photo${photoCount === 1 ? '' : 's'} on this phone`
      : 'View docket';
    const docketBtn = showView
      ? `<button type="button" class="btn-docket" data-person="${escapeHtml(g.id)}" data-docket-name="${escapeHtml(g.name)}" aria-label="${escapeHtml(viewLabel)}">View docket</button>`
      : '';
    // No capture attribute: the phone picker then offers the camera and the gallery.
    const addPhoto = `<label class="btn-add-photo">Add photo<input type="file" accept="image/*" multiple data-add-photo="${escapeHtml(g.id)}" aria-label="Add docket photo for ${escapeHtml(g.name)}"/></label>`;
    return `<section class="child ${allDone?'complete':''} ${g.missing?'missing':''}" data-person="${escapeHtml(g.id)}">
      <div class="child-head"><div class="child-head-text"><div class="child-name">${escapeHtml(g.name)}${badge}</div>
      ${meta?`<div class="child-meta">${escapeHtml(meta)}</div>`:''}</div><div class="docket-actions">${addPhoto}${docketBtn}${docketBadge}</div></div>
      ${rows}
      <div class="obs-wrap">
        <label for="obs-${g.id}">Observations</label>
        <textarea id="obs-${g.id}" class="${obsClass}" data-person="${g.id}" placeholder="Notes for this order…">${escapeHtml(obsVal)}</textarea>
      </div>
    </section>`;
  }).join('');
}
document.getElementById('list').addEventListener('change',e=>{
  const t=e.target;
  if (t.matches('input[type=file][data-add-photo]')) {
    const personId = t.dataset.addPhoto;
    const files = t.files ? [...t.files] : [];
    t.value = '';
    if (!files.length) return;
    addDocketPhotos(personId, files).then(n => {
      if (!n) { alert('Please choose a photo.'); return; }
      render();
    }).catch(() => alert('Could not save the photo on this phone.'));
    return;
  }
  if(!t.matches('input[type=checkbox][data-id]')) return;
  if(t.checked) done[t.dataset.id]=true; else delete done[t.dataset.id];
  saveDone(); render();
});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{ view=btn.dataset.view; render(); }));

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value || '';
  render();
});
document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    statusFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});

document.getElementById('list').addEventListener('input', (e) => {
  const t = e.target;
  if (!t.matches('textarea[data-person]')) return;
  const id = t.dataset.person;
  const val = t.value;
  if (val.trim()) { observations[id] = val; t.classList.add('has-text'); }
  else { delete observations[id]; t.classList.remove('has-text'); }
  saveObs();
});

function formatReportDate(d) {
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function entriesWithObs() {
  return PEOPLE
    .map(p => ({ p, note: (observations[p.id] || '').trim() }))
    .filter(x => x.note)
    .sort((a, b) => a.p.name.localeCompare(b.p.name));
}
function buildReportText() {
  const lines = [];
  const now = new Date();
  lines.push('Observations — ' + formatReportDate(now));
  lines.push('Generated: ' + now.toLocaleString('en-AU'));
  lines.push('');
  const rows = entriesWithObs();
  if (!rows.length) {
    lines.push('(No observations entered yet.)');
  } else {
    for (const { p, note } of rows) {
      const meta = [p.parent ? 'Parent: ' + p.parent : null, p.pickup ? 'Pickup ' + p.pickup : null].filter(Boolean).join(' · ');
      lines.push(p.name);
      if (meta) lines.push(meta);
      lines.push(note);
      lines.push('');
    }
  }
  return lines.join('\n').trim() + '\n';
}
function openReport() {
  const now = new Date();
  document.getElementById('reportDate').textContent = formatReportDate(now);
  const box = document.getElementById('reportEntries');
  const rows = entriesWithObs();
  if (!rows.length) {
    box.innerHTML = '<div class="report-empty">No observations yet.<br/>Add notes under each order, then come back here.</div>';
  } else {
    box.innerHTML = rows.map(({ p, note }) => {
      const meta = [p.parent ? 'Parent: ' + p.parent : null, p.pickup ? 'Pickup ' + p.pickup : null].filter(Boolean).join(' · ');
      return `<article class="obs-entry">
        <div class="who">${escapeHtml(p.name)}${p.missing ? ' <span class="badge">WAS MISSING</span>' : ''}</div>
        ${meta ? `<div class="who-meta">${escapeHtml(meta)}</div>` : ''}
        <div class="note">${escapeHtml(note)}</div>
      </article>`;
    }).join('');
  }
  document.body.classList.add('view-report');
  window.scrollTo(0, 0);
}
function closeReport() {
  document.body.classList.remove('view-report');
  }
document.getElementById('btnReport').addEventListener('click', openReport);
document.getElementById('btnBackTick').addEventListener('click', closeReport);
document.getElementById('btnCopyReport').addEventListener('click', async () => {
  const text = buildReportText();
  try {
    await navigator.clipboard.writeText(text);
    alert('Report copied');
  } catch {
    prompt('Copy report:', text);
  }
});
document.getElementById('btnDownloadReport').addEventListener('click', () => {
  const text = buildReportText();
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'canteen-observations-2026-09-17.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});




function closeDocketLightbox() {
  const box = document.getElementById('docketLightbox');
  box.classList.remove('open');
  box.setAttribute('aria-hidden', 'true');
  document.getElementById('lbImgs').replaceChildren();
  document.getElementById('lbActions').replaceChildren();
  revokeLbUrls();
  lbPersonId = null;
}
async function paintDocketLightbox(personId) {
  if (lbPersonId !== personId) return;
  const locals = await photosForPerson(personId);
  if (lbPersonId !== personId) return;
  revokeLbUrls();
  const imgs = document.getElementById('lbImgs');
  const actions = document.getElementById('lbActions');
  imgs.replaceChildren();
  actions.replaceChildren();
  const staticPaths = staticDocketsFor(personId);
  if (!locals.length && !staticPaths.length) {
    const empty = document.createElement('p');
    empty.className = 'lb-note';
    empty.textContent = 'No docket photos on this phone.';
    imgs.appendChild(empty);
    return;
  }
  for (const rec of locals) {
    const shot = document.createElement('div');
    shot.className = 'lb-shot';
    const cap = document.createElement('div');
    cap.className = 'lb-cap';
    cap.textContent = 'On this phone';
    const img = document.createElement('img');
    const url = URL.createObjectURL(rec.blob);
    lbObjectUrls.push(url);
    img.src = url;
    img.alt = 'Canteen docket photo on this phone';
    img.addEventListener('error', () => {
      const note = document.createElement('p');
      note.className = 'lb-note';
      note.textContent = 'Saved on this phone, but this browser cannot preview it.';
      img.replaceWith(note);
    });
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'lb-remove';
    rm.dataset.photoId = String(rec.id);
    rm.textContent = 'Remove photo';
    shot.append(cap, img, rm);
    imgs.appendChild(shot);
  }
  for (const src of staticPaths) {
    const shot = document.createElement('div');
    shot.className = 'lb-shot';
    const cap = document.createElement('div');
    cap.className = 'lb-cap';
    cap.textContent = 'Saved with orders';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Canteen docket';
    shot.append(cap, img);
    imgs.appendChild(shot);
  }
  if (locals.length) {
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'lb-clear';
    clear.textContent = locals.length === 1 ? 'Clear photo on this phone' : 'Clear all photos on this phone';
    actions.appendChild(clear);
  }
}
function openDocketLightbox(personId, title) {
  revokeLbUrls();
  lbPersonId = personId;
  const box = document.getElementById('docketLightbox');
  const imgs = document.getElementById('lbImgs');
  document.getElementById('lbTitle').textContent = title ? ('Docket · ' + title) : 'Docket';
  document.getElementById('lbActions').replaceChildren();
  imgs.replaceChildren();
  const loading = document.createElement('p');
  loading.className = 'lb-note';
  loading.textContent = 'Loading photos…';
  imgs.appendChild(loading);
  box.classList.add('open');
  box.setAttribute('aria-hidden', 'false');
  paintDocketLightbox(personId).catch(() => {
    if (lbPersonId !== personId) return;
    imgs.replaceChildren();
    const err = document.createElement('p');
    err.className = 'lb-note';
    err.textContent = 'Could not open photos saved on this phone.';
    imgs.appendChild(err);
  });
}
document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-docket');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  openDocketLightbox(btn.dataset.person || '', btn.dataset.docketName || '');
});
document.addEventListener('click', (e) => {
  const rm = e.target.closest('.lb-remove');
  if (rm) {
    e.preventDefault();
    e.stopPropagation();
    const photoId = Number(rm.dataset.photoId);
    const personId = lbPersonId;
    if (!personId || !photoId) return;
    rm.disabled = true;
    deleteDocketPhoto(photoId).then(() => {
      render();
      if (lbPersonId === personId) return paintDocketLightbox(personId);
    }).catch(() => alert('Could not remove that photo.'));
    return;
  }
  if (e.target.closest('.lb-clear')) {
    e.preventDefault();
    e.stopPropagation();
    const personId = lbPersonId;
    if (!personId) return;
    if (!confirm('Remove all docket photos for this order from this phone?')) return;
    clearDocketPhotos(personId).then(() => {
      render();
      if (lbPersonId === personId) return paintDocketLightbox(personId);
    }).catch(() => alert('Could not clear photos.'));
    return;
  }
  if (e.target.closest('#lbClose')) {
    e.preventDefault();
    e.stopPropagation();
    closeDocketLightbox();
    return;
  }
  if (e.target.id === 'docketLightbox') closeDocketLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDocketLightbox();
});

refreshDocketCounts().then(() => {
  const active = document.activeElement;
  if (active && active.matches && active.matches('textarea[data-person]')) return;
  render();
}).catch(() => {});
render();
</script>
