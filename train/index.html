<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script>
(function () {
  try {
    var raw = JSON.parse(localStorage.getItem("reef.v1") || "null");
    var theme = raw && raw.settings && raw.settings.theme;
    var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>
<title>Reef</title>
<meta name="description" content="Reef is a training log for IRONMAN 70.3 Cairns. Plans and results stay on this phone.">
<meta name="theme-color" content="#123f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brandrow">
      <div>
        <div class="kicker">
          <svg width="48" height="32" viewBox="0 0 48 32" aria-hidden="true">
            <circle cx="37" cy="7" r="3.5" fill="#f4efe4"/>
            <path d="M3 13c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 12 4" fill="none" stroke="#f4efe4" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M3 20c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 12 4" fill="none" stroke="#f4efe4" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M3 27c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 12 4" fill="none" stroke="#e36a3a" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          REEF
        </div>
        <h1 id="hello">Reef</h1>
      </div>
      <button type="button" class="iconbtn" id="themeBtn" data-act="theme-cycle" aria-label="Theme auto">◐</button>
    </div>
    <p id="sub"></p>
    <p id="goal"></p>
    <p id="offline" hidden>Offline · the plan is on this phone</p>
    <div id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastUndo" data-act="undo">Undo</button></div>
  </header>
  <main id="view"></main>
  <nav aria-label="Sections">
    <button type="button" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Today</span>
    </button>
    <button type="button" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Week</span>
    </button>
    <button type="button" data-tab="zones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Zones</span>
    </button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="17" r="2" fill="currentColor"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>
<div id="sheet" hidden></div>
<noscript><p style="padding:16px;font-family:sans-serif">Reef needs JavaScript. It still runs entirely on this phone.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
