function poseFig(){
  return fig([40,78],[[52,86,132,86],[132,86,156,112],[100,86,124,58],[124,58,150,46,1],[86,86,70,116],[70,116,96,124]],"","");

function figLines(lines){
  return lines.map(function(s){
    return '<line x1="'+s[0]+'" y1="'+s[1]+'" x2="'+s[2]+'" y2="'+s[3]+'" stroke="'+(s[4]?"var(--ac)":"currentColor")+'" stroke-width="6" stroke-linecap="round"/>';
  }).join("");
}
function head(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="8" fill="currentColor"/>'}
function illustration(s){
  var fn=DRAWS[s.id];
  var label=String(s.name).replace(/"/g,"'");
  var defs='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--ac)"/>'+endTag("marker")+endTag("defs");
  return '<svg data-pose="'+s.id+'" data-known="'+(fn?1:0)+'" viewBox="0 0 200 140" role="img" aria-label="'+label+'"><rect width="200" height="140" rx="12" fill="currentColor" opacity=".06"/>'+defs+(fn?fn():DRAWS.breath())+endTag("svg");
}
function info(id){
  var s=M[id];
  var q=encodeURIComponent(s.name.replace(/\(.*\)/,"").replace(/^(Foam roll|Massage ball): /,"$1 ").trim()+(s.rep?" exercise":" stretch")+" how to").replace(/%20/g,"+");
  var dose=s.rep?(C(id,"sets")+" sets × "+(s.hold?C(id,"hold")+"s hold":C(id,"reps")+" reps")+(s.perSide?" each side":"")+", "+C(id,"rest")+"s rest"):(C(id,"dur")+"s"+(s.perSide?" each side":""));
  $("sh").innerHTML='<h2 style="margin:0">'+s.name+'</h2><div class="mu">'+dose+'</div><div class="ill">'+illustration(s)+'</div><h3>Targets</h3>'+s.what+'<h3>Good for</h3>'+s.good+'<h3>How to</h3><ul>'+s.how.map(function(h){return "<li>"+h+"</li>"}).join("")+'</ul>'+(tab=="rehab"?'<p class="mu">Stop if sharp pain. See a physio if pain persists.</p>':"")+'<p><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">▶ Watch video</a> · <a href="https://www.google.com/search?tbm=isch&q='+q+'" target="_blank" rel="noopener">🖼 Pictures</a></p><button style="width:100%" id="cl">Close</button>';
  $("md").classList.add("show");
}
$("md").onclick=function(e){if(e.target.id=="md"||e.target.id=="cl") $("md").classList.remove("show")};
document.addEventListener("pointerdown",function(e){
  var t=e.target.closest&&e.target.closest("#go,[data-p],#ok,#vc,#pp");
  if(t) unlockAudio();
},{passive:true});
document.addEventListener("touchend",function(e){
  var t=e.target.closest&&e.target.closest("#go,[data-p],#ok,#vc");
  if(t) unlockAudio();
},{passive:true});
document.addEventListener("click",function(e){
  var d=e.target.closest("button")&&e.target.closest("button").dataset;
  if(!d) return;
  if(d.t){tab=d.t; SV("tab",tab); render(); scrollTo(0,0)}
  else if(d.r){sel[tab]=d.r; SV("sel",sel); render()}
  else if(d.p){
    unlockAudio(); primeSpeech();
    var s=M[d.p];
    if(s.rep) runT(d.p,C(d.p,"hold")*sides(d.p),"hold",function(){say("Set done. Rest."); if(!nextSet(d.p)) runT(d.p,C(d.p,"rest"),"rest",function(){say("Go")})});
    else runT(d.p,C(d.p,"dur")*sides(d.p),"hold");
  }
  else if(d.x) reset(d.x);
  else if(d.i) info(d.i);
  else if(d.ok) setDone(d.ok,!isDone(d.ok));
  else if(d.clear) clearRoutine();
  else if(d.plus){
    var id=d.plus, st=rc[id]||(rc[id]={set:1,rep:0});
    st.rep++;
    try{if(navigator.vibrate) navigator.vibrate(30)}catch(err){}
    beep(700,50);
    if(st.rep>=C(id,"reps")){upd(id); ding(); if(!nextSet(id)){say("Rest"); runT(id,C(id,"rest"),"rest",function(){say("Go")})}}
    else upd(id);
  }
  else if(d.rest){if(ct[d.rest]) clearInterval(ct[d.rest].iv), delete ct[d.rest]; runT(d.rest,C(d.rest,"rest"),"rest")}
});
document.addEventListener("change",function(e){
  var id=e.target.dataset.c, k=e.target.dataset.k;
  if(id){(cfg[id]=cfg[id]||{})[k]=Math.max(1,+e.target.value||M[id][k]); SV("cfg",cfg); render()}
});
$("theme").onclick=function(){SV("light",document.body.classList.toggle("light"))};
let steps=[], si=0, left=0, paused=false, tick=0, lock=null, rname="";
function sideLine(st){
  var setTxt=st.set?("Set "+st.set+"/"+C(st.id,"sets")+" · "):"";
  if(st.k=="ready") return "Get ready"+(st.side?" · "+st.side:"");
  if(st.k=="rest") return "Rest";
  if(st.k=="reps") return setTxt+C(st.id,"reps")+" reps"+(st.side?" · "+st.side:"");
  return (setTxt+(st.side||"")).trim();
}
function build(){
  steps=[];
  TABS[tab].R[cur()].forEach(function(id){
    var s=M[id], sd=s.perSide?["Left side","Right side"]:[""];
    if(!s.rep){
      if(s.perSide){
        var dur=C(id,"dur");
        steps.push({id:id,side:"Left side",k:"ready",t:5});
        steps.push({id:id,side:"Left side",k:"hold",t:dur*2,half:dur,perSide:true});
      }else{
        steps.push({id:id,side:"",k:"ready",t:5});
        steps.push({id:id,side:"",k:"hold",t:C(id,"dur")});
      }
    }else{
      var n=C(id,"sets");
      steps.push({id:id,side:"",k:"ready",t:5});
      for(var i=1;i<=n;i++){
        sd.forEach(function(side){
          steps.push(s.hold?{id:id,side:side,k:"hold",t:C(id,"hold"),set:i}:{id:id,side:side,k:"reps",set:i});
          if(s.perSide&&side=="Left side") steps.push({id:id,side:"Right side",k:"ready",t:5,set:i});
        });
        if(i<n) steps.push({id:id,side:"",k:"rest",t:C(id,"rest"),set:i});
      }
    }
  });
}
async function wl(on){try{if(on&&navigator.wakeLock) lock=await navigator.wakeLock.request("screen"); else if(lock){lock.release(); lock=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible"&&$("ov").classList.contains("show")) wl(true)});
function show(){
  hideSwitch();
  var st=steps[si], s=M[st.id];
  st.cued=false;
  left=st.t||0;
  var ids=TABS[tab].R[rname];
  $("oname").textContent=s.name;
  $("oside").textContent=sideLine(st);
  var n=ids.filter(isDone).length;
  $("ostep").textContent=(ids.indexOf(st.id)+1)+" / "+ids.length+" · "+n+"/"+ids.length+" done";
  var nx=null;
  for(var i=si+1;i<steps.length;i++){if(steps[i].k!="ready"&&steps[i].k!="rest"){nx=steps[i]; break}}
  $("onext").textContent=nx?"Next: "+M[nx.id].name+(nx.side?" ("+nx.side+")":""):"Last one!";
  $("pb").style.width=(si/steps.length*100)+"%";
  $("otime").textContent=st.k=="reps"?"✋":left;
  $("dn").style.display=st.k=="reps"?"block":"none";
  $("ok").style.display="";
  if(st.k=="ready"){
    var switching=steps[si-1]&&steps[si-1].id==st.id&&st.side;
    if(switching) switchSidesCue();
    else say("Next: "+s.name+(st.side?", "+st.side:""));
  }
  if(st.k=="reps") say(C(st.id,"reps")+" reps"+(st.side?", "+st.side:"")+". Tap done when finished.");
  if(st.k=="rest") say("Rest");
}
function start(){
  unlockAudio();
  build(); rname=cur(); si=0; paused=false;
  $("pp").textContent="⏸";
  $("ov").classList.add("show");
  $("ok").style.display="";
  wl(true); beep(660,100); show();
  if(!speechPrimed) primeSpeech();
  clearInterval(tick);
  tick=setInterval(function(){
    if(paused||!steps[si]||steps[si].k=="reps") return;
    left--;
    $("otime").textContent=Math.max(left,0);
    var st=steps[si];
    if(st.perSide&&!st.cued&&left===st.half){
      st.cued=true; switchSidesCue();
      $("oside").textContent="Right side";
    }
    if(left<=3&&left>0&&st.k!="hold") beep(520,80);
    if(left<=0){if(st.k=="hold") ding(); next()}
  },1000);
}
function next(){
  si++;
  if(si>=steps.length) return finish();
  show();
}
function skipExercise(){
  if(!steps[si]) return;
  var id=steps[si].id, j=si+1;
  while(j<steps.length&&steps[j].id===id) j++;
  si=j;
  if(si>=steps.length) finish();
  else show();
}
function finish(){
  clearInterval(tick); hideSwitch();
  hist.push({d:new Date().toDateString(),r:rname}); SV("hist",hist);
  say("Routine complete. Great work.");
  $("pb").style.width="100%";
  $("oname").textContent="Done!";
  $("oside").textContent="";
  $("otime").textContent="✓";
  $("dn").style.display="none";
  $("ok").style.display="none";
  $("onext").textContent="Streak: "+streak()+" day(s)";
  wl(false); render();
}
$("go").onclick=function(){unlockAudio(); start()};
$("ok").onclick=function(){
  if(!$("ov").classList.contains("show")||!steps[si]) return;
  unlockAudio();
  setDone(steps[si].id,true);
  beep(660,80);
  skipExercise();
};
$("dn").onclick=function(){ding(); next()};
$("pp").onclick=function(){paused=!paused; $("pp").textContent=paused?"▶":"⏸"};
$("sk").onclick=function(){if(si<steps.length) next()};
$("bk").onclick=function(){var j=si-1; while(j>0&&steps[j].k!="ready") j--; si=Math.max(0,j); show()};
$("ex").onclick=function(){clearInterval(tick); hideSwitch(); $("ov").classList.remove("show"); wl(false); try{if(window.speechSynthesis) speechSynthesis.cancel()}catch(e){}}
$("vc").textContent=voice?"🔊 Voice on":"🔇 Voice off";
$("vc").onclick=function(){unlockAudio(); primeSpeech(); voice=!voice; SV("voice",voice); $("vc").textContent=voice?"🔊 Voice on":"🔇 Voice off"};
render();

</script></body></html>
